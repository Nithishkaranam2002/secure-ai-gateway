name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No API keys are set here on purpose. The suite must pass without
        # network access, which is what keeps it fast and what stops a provider
        # outage from turning into a failing build.
        env:
          JWT_SECRET: ci-secret-not-used-outside-tests
          LOG_LEVEL: WARNING
        run: pytest -q
