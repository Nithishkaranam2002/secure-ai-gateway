services:
  mcp-gateway:
    build: .
    container_name: mcp-gateway
    command: >
      sh -c "python -m scripts.seed_database &&
             uvicorn src.mcp_gateway.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/gateway.db
    volumes:
      - gateway-data:/app/data

  llm-gateway:
    build: .
    container_name: llm-gateway
    command: >
      sh -c "python -m scripts.seed_database &&
             uvicorn src.llm_gateway.app:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/gateway.db
      # Containers reach each other by service name, not by loopback.
      MCP_GATEWAY_URL: http://mcp-gateway:8000
    volumes:
      - gateway-data:/app/data
    depends_on:
      - mcp-gateway

volumes:
  gateway-data:
